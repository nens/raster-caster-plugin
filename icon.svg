<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Raster Caster">
  <defs>
    <linearGradient id="melt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="0.5" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#a02c1f"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d9aa6"/>
      <stop offset="0.5" stop-color="#4a555f"/>
      <stop offset="1" stop-color="#232a30"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1a0"/>
      <stop offset="0.5" stop-color="#c99530"/>
      <stop offset="1" stop-color="#6b4415"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8c1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- riveted crane girder -->
  <rect x="2" y="2" width="60" height="3.4" rx="1" fill="url(#iron)"/>
  <rect x="2" y="5.4" width="60" height="1.3" fill="#12161a"/>
  <g fill="#caa85f">
    <circle cx="6" cy="3.7" r="0.85"/>
    <circle cx="14" cy="3.7" r="0.85"/>
    <circle cx="30" cy="3.7" r="0.85"/>
    <circle cx="38" cy="3.7" r="0.85"/>
    <circle cx="46" cy="3.7" r="0.85"/>
    <circle cx="54" cy="3.7" r="0.85"/>
    <circle cx="58" cy="3.7" r="0.85"/>
  </g>

  <!-- hoist chain -->
  <g stroke="#7f8b96" stroke-width="1.1" fill="none">
    <ellipse cx="22" cy="8.6" rx="1.3" ry="1.9"/>
    <ellipse cx="22" cy="11.6" rx="1.3" ry="1.9"/>
    <ellipse cx="22" cy="14.6" rx="1.3" ry="1.9"/>
  </g>
  <rect x="21.2" y="15.6" width="1.6" height="3.6" fill="#3f4952"/>

  <!-- soot-blackened foundry ladle, tipped to pour -->
  <g transform="rotate(32 22 20)">
    <path d="M13 13h18l-2.5 14a6.5 6.5 0 0 1-13 0z" fill="url(#iron)"/>
    <path d="M15 13h3l-1.4 15.4a6.5 6.5 0 0 1-2.3-2.4z" fill="#aab6c0" opacity="0.25"/>
    <rect x="14.8" y="22.6" width="14.4" height="2.4" fill="url(#brass)"/>
    <g fill="#f0d089">
      <circle cx="17" cy="23.8" r="0.6"/>
      <circle cx="22" cy="23.8" r="0.6"/>
      <circle cx="27" cy="23.8" r="0.6"/>
    </g>
    <rect x="11" y="10.5" width="22" height="3" rx="1.5" fill="url(#brass)"/>
    <g fill="#f5dda2">
      <circle cx="14" cy="12" r="0.6"/>
      <circle cx="18" cy="12" r="0.6"/>
      <circle cx="22" cy="12" r="0.6"/>
      <circle cx="26" cy="12" r="0.6"/>
      <circle cx="30" cy="12" r="0.6"/>
    </g>
    <path d="M15.5 15h13l-1.2 6a6 6 0 0 1-10.6 0z" fill="url(#melt)"/>
  </g>

  <!-- trunnion pin the ladle tips on -->
  <circle cx="22" cy="19.6" r="2.1" fill="url(#brass)"/>
  <circle cx="22" cy="19.6" r="0.8" fill="#2a211a"/>

  <!-- heat haze over the pour -->
  <circle cx="37.4" cy="41" r="10" fill="url(#glow)"/>

  <!-- pour stream: leaves the lip tangent to the rim, then falls parabolically -->
  <path d="M32.63 19.12Q35.6 20.98 36.4 41H38.4Q37.97 22.46 35 20.6Z" fill="url(#melt)"/>
  <path d="M33.5 19.6Q35.9 21.2 37.1 41h1Q37.6 21.9 34.8 19.9Z" fill="#ffe9a8" opacity="0.5"/>

  <!-- riveted casting bed, filling as a raster grid -->
  <rect x="8" y="41" width="48" height="19" rx="2" fill="#1b2126"/>
  <g>
    <rect x="10" y="43" width="11" height="7.5" fill="#2e3941"/>
    <rect x="21" y="43" width="11" height="7.5" fill="#55707f"/>
    <rect x="32" y="43" width="11" height="7.5" fill="#ff8c1a"/>
    <rect x="43" y="43" width="11" height="7.5" fill="#4a5f6d"/>
    <rect x="10" y="50.5" width="11" height="7.5" fill="#55707f"/>
    <rect x="21" y="50.5" width="11" height="7.5" fill="#93a9b5"/>
    <rect x="32" y="50.5" width="11" height="7.5" fill="#6f8794"/>
    <rect x="43" y="50.5" width="11" height="7.5" fill="#3f4e59"/>
  </g>
  <path d="M21 43v15M32 43v15M43 43v15M10 50.5h44" stroke="#1b2126" stroke-width="0.9"/>
  <rect x="8" y="41" width="48" height="19" rx="2" fill="none" stroke="url(#brass)" stroke-width="1.6"/>
  <g fill="#e0bd75">
    <circle cx="10.6" cy="43.6" r="0.75"/>
    <circle cx="53.4" cy="43.6" r="0.75"/>
    <circle cx="10.6" cy="57.4" r="0.75"/>
    <circle cx="53.4" cy="57.4" r="0.75"/>
  </g>

  <!-- splash and sparks at the impact -->
  <path d="M33.4 43.4q1.4-3.4 4-3.4t4.2 3.4z" fill="url(#melt)"/>
  <g fill="#ffe9a8">
    <circle cx="31.3" cy="38.6" r="0.8"/>
    <circle cx="43.4" cy="37.4" r="0.7"/>
    <circle cx="41.6" cy="33.2" r="0.55"/>
    <circle cx="29.9" cy="34.4" r="0.5"/>
  </g>

  <!-- steam wisps -->
  <g fill="#cfd8dd" opacity="0.3">
    <path d="M45.6 39.6c2.4-2 1.6-4.4-.2-5.6 3.2.8 4.4 3.8 2.2 5.6z"/>
    <path d="M27.4 39c-2.2-2.2-1.2-4.6.6-5.6-3.2 1-4 4-1.8 5.6z"/>
  </g>
</svg>
