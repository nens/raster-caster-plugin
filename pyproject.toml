[tool.isort]
profile = "black"
# Explicit, because isort otherwise infers this from the checkout directory name,
# which differs between local (raster_caster_plugin) and CI (raster-caster-plugin).
known_first_party = ["raster_caster_plugin"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
