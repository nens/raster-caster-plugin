name: test

# Run on pull requests and on the master branch itself.
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

  permissions:
    contents: write

jobs:
  build_upload:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code.
      - uses: actions/checkout@v2

      - name: build
        run: |
          docker compose build qgis

      - name: test
        run: |
          docker compose run --rm qgis pytest -v test

      - name: Generate plugin ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker compose run --rm qgis python3 zip_plugin.py

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            raster_caster_plugin.${{ github.ref_name }}.zip
